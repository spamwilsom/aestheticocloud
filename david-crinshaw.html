<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>David Crinshaw &mdash; Aesthetico Limited</title>
  <meta name="description" content="David Crinshaw: a satirical fashion-art label of hand-painted garments, canvases and installations, by Aesthetico Limited." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #0a0a0a; --paper: #fafafa; --dim: #8a8a8a; --rule: #dcdcdc;
      --serif: 'Baskerville', 'Libre Baskerville', 'Georgia', serif;
      --mono: 'Courier New', 'Courier', monospace;
      --heavy: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
    }
    body { background: var(--paper); color: var(--ink); font-family: var(--serif); padding: 3rem 2rem; max-width: 1040px; margin: 0 auto; }
    a { color: inherit; }
    .label { font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--dim); }
    .label a { text-decoration: none; }
    .label a:hover { color: var(--ink); }

    header { display: flex; justify-content: space-between; align-items: baseline; gap: 2rem; padding-bottom: 1rem; border-bottom: 2px solid var(--ink); margin-bottom: 3rem; }
    .brand { font-family: var(--heavy); font-weight: 900; font-size: 1rem; letter-spacing: -0.01em; text-decoration: none; }

    h1 { font-family: var(--heavy); font-weight: 900; font-size: clamp(2.4rem, 8vw, 4.6rem); line-height: 0.95; letter-spacing: -0.03em; margin-bottom: 1.5rem; }
    .lede { font-size: 1.15rem; line-height: 1.65; max-width: 560px; margin-bottom: 3rem; }

    figure { margin: 0; }
    figure img { display: block; width: 100%; height: auto; background: #eee; }
    figcaption { font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); padding-top: 0.5rem; }

    .hero { margin-bottom: 3.5rem; }

    h2 { font-family: var(--heavy); font-weight: 900; font-size: 1rem; letter-spacing: -0.01em; padding-bottom: 0.6rem; border-bottom: 1px solid var(--ink); margin-bottom: 1.5rem; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; margin-bottom: 3.5rem; }
    .grid.two { grid-template-columns: repeat(2, 1fr); }

    .closing { margin-bottom: 3rem; }

    footer { margin-top: 3rem; padding-top: 1.25rem; border-top: 2px solid var(--ink); display: flex; justify-content: space-between; gap: 1rem; }

    @media (max-width: 640px) {
      body { padding: 2rem 1.25rem; }
      .grid, .grid.two { grid-template-columns: 1fr 1fr; gap: 0.75rem; }
      footer { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header>
    <a class="brand" href="index.html">Aesthetico Limited</a>
    <span class="label"><a href="index.html">&larr; Index</a></span>
  </header>

  <h1>David<br>Crinshaw</h1>
  <p class="lede">A satirical fashion-art label. Garments are painted, dyed and printed by hand, then shown alongside canvases and drawings as installations.</p>

  <figure class="hero">
    <img src="assets/dc/gallery-wall.jpg" alt="A red gallery wall hung with painted canvases, hand-lettered text pieces and several painted and printed T-shirts on hangers." />
    <figcaption>Installation view</figcaption>
  </figure>

  <h2>Garments</h2>
  <div class="grid">
    <figure>
      <img src="assets/dc/tee-ink-flower.jpg" alt="White T-shirt washed in grey and blue with an ink drawing of a drooping flower in a pot." loading="lazy" />
      <figcaption>Ink wash, flower</figcaption>
    </figure>
    <figure>
      <img src="assets/dc/tee-brushwork.jpg" alt="White T-shirt covered in black and navy brush strokes." loading="lazy" />
      <figcaption>Brushwork</figcaption>
    </figure>
    <figure>
      <img src="assets/dc/tee-dip-dye.jpg" alt="White T-shirt dyed in pink, plum and grey with white drawn lines like a mountain range." loading="lazy" />
      <figcaption>Dye, ridgeline</figcaption>
    </figure>
    <figure>
      <img src="assets/dc/tee-green-print.jpg" alt="White T-shirt printed with four portrait panels in dark green, hung on a red wall." loading="lazy" />
      <figcaption>Portrait print</figcaption>
    </figure>
  </div>

  <h2>Selections</h2>
  <div class="grid two">
    <figure>
      <img src="assets/dc/tees-hanging-1.jpg" alt="Two hand-painted T-shirts on hangers against a pale wall." loading="lazy" />
    </figure>
    <figure>
      <img src="assets/dc/tees-hanging-2.jpg" alt="Two T-shirts on hangers, one dyed pink and black, one with white and black brush strokes." loading="lazy" />
    </figure>
  </div>

  <figure class="closing">
    <img src="assets/dc/wall-of-tees.jpg" alt="Black and white photograph of a wall densely hung with hand-painted T-shirts." loading="lazy" />
    <figcaption>Wall of garments</figcaption>
  </figure>

  <footer class="label">
    <span>&copy; 2026 Aesthetico Limited &middot; Ontario, Canada</span>
    <span><a href="privacy.html">Privacy</a> &middot; All rights reserved</span>
  </footer>

</body>
</html>
